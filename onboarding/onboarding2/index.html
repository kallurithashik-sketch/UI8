<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFlow Onboarding</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            ✦ NovaFlow
        </div>

        <div class="card">

            <div class="icon">
                ✓
            </div>

            <p class="step">STEP 01</p>

            <h1>
                Let's make this
                <span>personal.</span>
            </h1>

            <p class="description">
                Welcome to NovaFlow. Let's set up your workspace.
            </p>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <input
                type="text"
                id="company"
                placeholder="Enter your company"
            >

            <button onclick="continueSetup()">
                Continue →
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
